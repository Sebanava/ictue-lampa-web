<!-- Petición de Oración -->
<section class="oracion" id="oracion">
    <div class="container">
        <h2 class="section-title">Envía tu Petición de Oración</h2>
        <p style="text-align:center; color:#64748b; margin-bottom: 2.5rem; font-size: 1.05rem;">
            Cuéntanos tu necesidad y nuestro equipo pastoral orará por ti 🙏
        </p>
        <div class="oracion-form-wrapper">
            <div class="oracion-card">
                <div class="oracion-field">
                    <label for="oracion-nombre">Tu nombre</label>
                    <input type="text" id="oracion-nombre" placeholder="¿Cómo te llamas?" maxlength="50">
                </div>
                <div class="oracion-field">
                    <label for="oracion-peticion">Tu petición de oración</label>
                    <textarea id="oracion-peticion" placeholder="Cuéntanos qué necesitas llevar en oración..." rows="5" maxlength="500"></textarea>
                </div>
                <button class="oracion-btn" onclick="enviarPeticion()">
                    🙏 Enviar Petición por WhatsApp
                </button>
            </div>
        </div>
    </div>
</section>
